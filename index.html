<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портфолио — видеомонтаж</title>
<meta name="description" content="Портфолио видеомонтажёра: реклама, онлайн-курсы, события.">
<meta name="theme-color" content="#0a0a0c">
<style>
:root{
  --bg:#0a0a0c; --panel:#131317; --line:#26262d; --text:#f2efe9; --mute:#9a978f;
  --accent:#e9b872; --r:14px;
  --font:"Inter Tight","Inter","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}

/* шапка */
.top{position:fixed;inset:0 0 auto 0;z-index:20;transition:background .3s,backdrop-filter .3s}
.top.solid{background:rgba(10,10,12,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.brand{font-weight:700;letter-spacing:.02em;margin-right:auto}
.nav{display:flex;gap:24px;font-size:15px;color:#d6d2ca}
.nav a:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:var(--accent);color:#15120c;font-weight:650;font-size:15px;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.35)}
.btn.small{padding:8px 16px}

/* первый экран */
.hero{position:relative;height:100svh;min-height:560px;display:flex;align-items:flex-end;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.55) 0%,rgba(10,10,12,.15) 35%,rgba(10,10,12,.6) 70%,var(--bg) 100%)}
.hero .wrap{position:relative;z-index:1;width:100%;padding-bottom:72px}
.eyebrow{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:clamp(46px,9vw,128px);line-height:.95;letter-spacing:-.035em;font-weight:750;margin:14px 0 22px}
.hero p{max-width:560px;font-size:clamp(17px,1.6vw,21px);color:#e4e0d8;margin:0 0 30px}
.hero .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:34px;font-size:14px;color:#cfcbc3}
.facts b{color:var(--text);font-weight:650}

/* инструменты на первом экране и подсветка по краям страницы */
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:26px}
.tools .lbl{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#cfcbc3;margin-right:8px}
.tool{--c:#e9b872;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(15,15,18,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);transition:border-color .3s,box-shadow .3s,transform .3s}
.tool svg{width:30px;height:30px;overflow:visible}
.tool:hover,.tool.active,.tool:focus-visible{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 30px -2px var(--c);transform:translateY(-3px);outline:none}
#tagline b{color:color-mix(in srgb,var(--tc,var(--accent)) 60%,#fff);font-weight:650}
#tagline.sw{animation:tag-in .35s ease}
@keyframes tag-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.glow{--g:#e9b872;position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .45s,box-shadow .45s;
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--g) 75%,transparent),inset 0 0 150px 24px color-mix(in srgb,var(--g) 50%,transparent)}
.glow.on{opacity:1}
.lg-premiere svg{animation:ai-pulse 3s ease-in-out infinite}

/* секции */
section.block{padding:88px 0 8px}
.head{display:flex;align-items:baseline;gap:20px;margin-bottom:30px;border-top:1px solid var(--line);padding-top:26px}
.head .num{font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.1em}
.head h2{font-size:clamp(32px,4.4vw,56px);line-height:1;letter-spacing:-.03em;margin:0;font-weight:720}
.head p{margin:0 0 0 auto;max-width:400px;color:var(--mute);font-size:15px;text-align:right}

.grid{display:grid;gap:22px}
.grid.three{grid-template-columns:repeat(3,1fr)}
.grid.two{grid-template-columns:repeat(2,1fr)}
.grid.course{grid-template-columns:256fr 81fr 81fr}
.grid.feature{grid-template-columns:1.7fr 1fr;align-items:center;gap:44px}

.card{display:block;text-align:left;width:100%}
.shot{position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--panel)}
.card.vert .shot{aspect-ratio:9/16}
.shot img,.shot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .35s}
.shot video{opacity:0}
.shot video.on{opacity:1}
.card:hover .shot img,.card:hover .shot video{transform:scale(1.035)}
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.time{position:absolute;right:12px;bottom:12px;z-index:2;font-size:13px;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:999px}
.play{position:absolute;left:14px;bottom:12px;z-index:2;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);display:grid;place-items:center;transition:background .25s,transform .25s}
.play svg{width:16px;height:16px;fill:#fff;margin-left:2px}
.card:hover .play{background:var(--accent);transform:scale(1.08)}
.card:hover .play svg{fill:#15120c}
.cap{display:block;padding:14px 2px 0}
.cap .k{display:block;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cap .t{display:block;font-size:21px;font-weight:650;letter-spacing:-.01em;margin-top:3px}
.card.vert .cap .t{font-size:18px}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:var(--r)}

.feature-text .k{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.feature-text h3{font-size:clamp(26px,3vw,38px);letter-spacing:-.02em;line-height:1.1;margin:8px 0 14px}
.feature-text p{color:#d2cec6;margin:0 0 20px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;border:1px solid var(--line);color:#d2cec6;padding:5px 12px;border-radius:999px}

/* нейросети */
.ai-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.ai{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px 22px 24px;transition:border-color .3s,transform .3s}
.ai:hover{border-color:#3d3d48;transform:translateY(-3px)}
.ai .logo{width:60px;height:60px;display:grid;place-items:center;margin-bottom:20px}
.ai .logo svg{width:54px;height:54px;overflow:visible}
.ai b{display:block;font-size:21px;font-weight:650;letter-spacing:-.01em;margin-bottom:6px}
.ai span{display:block;font-size:14.5px;color:var(--mute);line-height:1.45}
.lg-chatgpt svg{animation:ai-spin 16s linear infinite}
.lg-claude svg{animation:ai-breathe 3.6s ease-in-out infinite}
.lg-gemini svg{animation:ai-twinkle 4.5s cubic-bezier(.6,0,.3,1) infinite}
.lg-seedance .ring{transform-origin:12px 12px;animation:ai-spin 5s linear infinite}
.lg-seedance .tri{transform-origin:12px 12px;animation:ai-pulse 1.8s ease-in-out infinite}
.ai:hover .lg-chatgpt svg{animation-duration:4s}
.ai:hover .lg-claude svg{animation-duration:1.4s}
.ai:hover .lg-gemini svg{animation-duration:1.8s}
.ai:hover .lg-seedance .ring{animation-duration:1.6s}
@keyframes ai-spin{to{transform:rotate(360deg)}}
@keyframes ai-breathe{0%,100%{transform:scale(.9) rotate(-8deg)}50%{transform:scale(1.08) rotate(8deg)}}
@keyframes ai-twinkle{0%,100%{transform:scale(1) rotate(0)}45%{transform:scale(.55) rotate(90deg)}60%{transform:scale(1.12) rotate(90deg)}75%{transform:scale(1) rotate(90deg)}}
@keyframes ai-pulse{0%,100%{transform:scale(.88)}50%{transform:scale(1.08)}}

/* пример: фото → промт → цвет → видео */
.flow{display:grid;grid-template-columns:1fr 1fr;gap:34px 26px}
.step.wide{grid-column:1/-1}
.frame{position:relative}
.media{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
/* ползунок «Было / Стало» */
.cmp{--p:50%;position:relative;width:100%;height:100%;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;pointer-events:none;-webkit-user-drag:none}
.cmp .before{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.cmp .knob{position:absolute;top:50%;left:var(--p);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;color:#15120c;display:grid;place-items:center;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.45);transition:transform .2s}
.cmp:hover .knob,.cmp.drag .knob{transform:scale(1.1)}
.cmp .knob svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cmp .tag{position:absolute;bottom:14px;padding:6px 16px;border-radius:999px;background:#fff;color:#15120c;font-size:14px;font-weight:600;pointer-events:none}
.cmp .tag.l{left:14px}.cmp .tag.r{right:14px}
.cmp input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.cmp input:focus-visible ~ .knob{outline:3px solid var(--accent);outline-offset:3px}
.media.prompt{aspect-ratio:auto;padding:18px 20px 16px;overflow:auto;font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;font-size:12.5px;line-height:1.55;color:#dcd8d0}
.media.prompt i{font-style:normal;display:inline-block;width:7px;height:1.1em;margin-left:2px;vertical-align:text-bottom;background:var(--accent);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.step .who{display:flex;align-items:center;gap:10px;margin:16px 0 6px}
.step .who .n{font-size:13px;color:var(--accent);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.step .who .mini{display:grid;place-items:center;width:22px;height:22px}
.step .who .mini svg{width:20px;height:20px;overflow:visible}
.step .who b{font-size:17px;font-weight:650}
.step p{font-size:14.5px;line-height:1.45;color:var(--mute);margin:0}

/* навыки */
.skills{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--line)}
.skill{padding:26px 22px 26px 0;border-bottom:1px solid var(--line)}
.skill + .skill{padding-left:22px;border-left:1px solid var(--line)}
.skill b{display:block;font-size:19px;font-weight:650;margin-bottom:6px}
.skill span{font-size:14.5px;color:var(--mute);line-height:1.45;display:block}

/* контакты */
.contact{padding:110px 0 90px;text-align:center}
.contact h2{font-size:clamp(36px,6vw,84px);line-height:1;letter-spacing:-.035em;margin:0 0 16px;font-weight:740}
.contact p{color:var(--mute);margin:0 auto 30px;max-width:480px}
.contact .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* плеер */
.lb{position:fixed;inset:0;z-index:50;background:#060608;display:none;grid-template-columns:minmax(0,1fr) 360px;gap:0}
.lb.open{display:grid}
.stage{position:relative;display:grid;place-items:center;padding:56px 24px 24px;min-height:0;min-width:0}
.stage video{max-width:100%;max-height:calc(100svh - 80px);border-radius:10px;background:#000;outline:none;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.info{border-left:1px solid var(--line);background:var(--panel);padding:64px 30px 30px;overflow:auto;display:flex;flex-direction:column}
.info .k{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.info h3{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:10px 0 6px}
.info .meta{color:var(--mute);font-size:14px;margin-bottom:18px}
.info p{color:#d8d4cc;margin:0 0 20px}
.info .pager{margin-top:auto;padding-top:26px;display:flex;gap:10px;align-items:center}
.info .count{margin-left:auto;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s}
.ibtn:hover{background:#1e1e24;border-color:#3a3a44}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.close{position:absolute;top:12px;right:14px;z-index:3;background:rgba(19,19,23,.8)}
.hint{color:var(--mute);font-size:12.5px;margin-top:14px}

@media (max-width:980px){
  .wrap{padding:0 18px}
  .nav{display:none}
  .head{flex-wrap:wrap}
  .head p{margin-left:0;text-align:left;max-width:none;width:100%}
  .grid.three,.grid.two,.grid.feature{grid-template-columns:1fr}
  .grid.course{grid-template-columns:1fr 1fr}
  .grid.course .card:first-child{grid-column:1/-1}
  .grid.feature{gap:20px}
  .flow{grid-template-columns:1fr;gap:28px}
  .ai-grid{grid-template-columns:1fr 1fr;gap:12px}
  .ai{padding:20px 16px}
  .skills{grid-template-columns:1fr 1fr}
  .skill,.skill + .skill{padding:20px 14px 20px 0;border-left:0}
  section.block{padding-top:64px}
  .lb{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .stage{padding:60px 0 0}
  .stage video{border-radius:0;max-height:62svh}
  .info{border-left:0;padding:22px 18px 28px;background:transparent}
  .hint{display:none}
}
@media (max-width:600px){
  .ai-grid{grid-template-columns:1fr}
  .ai{display:grid;grid-template-columns:52px 1fr;column-gap:14px;align-items:start}
  .ai .logo{width:52px;height:52px;margin:0;grid-row:1/3}
  .ai .logo svg{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .shot img,.shot video,.btn,.play{transition:none}
  [class*="lg-"] svg,[class*="lg-"] svg *,#tagline.sw{animation:none!important}
  .glow,.tool{transition:none}
}
</style>
</head>
<body>

<div class="glow" id="glow" aria-hidden="true"></div>

<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="#hero" id="brand"></a>
    <nav class="nav" id="nav"></nav>
    <a class="btn small" href="#contact" id="navContact" hidden>Связаться</a>
  </div>
</header>

<section class="hero" id="hero">
  <video src="media/showreel.mp4" poster="media/japan.jpg" autoplay muted loop playsinline preload="auto"></video>
  <div class="wrap">
    <div class="eyebrow" id="role"></div>
    <h1 id="name"></h1>
    <p id="tagline"></p>
    <div class="row">
      <a class="btn" href="#works">Смотреть работы
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </a>
      <button class="btn ghost" id="playFirst">▶ Включить первый ролик</button>
    </div>
    <div class="facts" id="facts"></div>
    <div class="tools" id="tools"></div>
  </div>
</section>

<section class="block" id="s-example" hidden>
  <div class="wrap">
    <div class="head"><span class="num">ИИ</span><h2 id="exTitle"></h2><p id="exNote"></p></div>
    <div class="flow" id="aiFlow"></div>
  </div>
</section>

<main id="works"></main>

<section class="block" id="s-ai" hidden>
  <div class="wrap">
    <div class="head"><span class="num" id="aiNum"></span><h2 id="aiTitle"></h2><p id="aiNote"></p></div>
    <div class="ai-grid" id="aiGrid"></div>
  </div>
</section>

<section class="block" id="skills-block">
  <div class="wrap">
    <div class="head"><span class="num" id="skillsNum"></span><h2>Что делаю</h2></div>
    <div class="skills" id="skills"></div>
  </div>
</section>

<section class="contact" id="contact" hidden>
  <div class="wrap">
    <h2>Обсудим ваш ролик?</h2>
    <p id="contactNote">Напишите пару слов о задаче — отвечу и назову сроки.</p>
    <div class="row" id="contactRow"></div>
  </div>
</section>

<footer><div class="wrap"><span id="foot"></span><a href="#hero">Наверх ↑</a></div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Просмотр ролика">
  <div class="stage">
    <button class="ibtn close" id="lbClose" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <video id="lbVideo" controls playsinline preload="metadata"></video>
  </div>
  <aside class="info">
    <div class="k" id="lbKind"></div>
    <h3 id="lbTitle"></h3>
    <div class="meta" id="lbMeta"></div>
    <p id="lbText"></p>
    <div class="tags" id="lbTags"></div>
    <div class="pager">
      <button class="ibtn" id="lbPrev" aria-label="Предыдущая работа"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="ibtn" id="lbNext" aria-label="Следующая работа"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="count" id="lbCount"></span>
    </div>
    <div class="hint">← → листать · Esc закрыть · F на весь экран</div>
  </aside>
</div>

<script src="works.js"></script>
<script>
(function(){
  var P = window.PORTFOLIO, $ = function(id){return document.getElementById(id)};
  function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e}
  var all = [];
  P.sections.forEach(function(s){ s.items.forEach(function(w){ w.section = s.title; all.push(w) }) });

  // тексты
  document.title = P.name + " — " + P.role.toLowerCase();
  $("brand").textContent = P.name; $("name").textContent = P.name;
  $("role").textContent = P.role + " · портфолио"; $("tagline").textContent = P.tagline;
  $("foot").textContent = "© " + new Date().getFullYear() + " " + P.name;
  [[all.length, "работ"], [P.sections.length, "направления"], ["16:9 и 9:16", "форматы"]].forEach(function(f){
    var s = el("span"); var b = el("b", null, f[0] + " "); s.appendChild(b); s.appendChild(document.createTextNode(f[1])); $("facts").appendChild(s);
  });

  var PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
  function card(w){
    var b = el("button", "card" + (w.vertical ? " vert" : "")); b.type = "button"; b.dataset.id = w.id;
    b.setAttribute("aria-label", "Смотреть: " + w.title + ", " + w.time);
    var shot = el("span", "shot");
    var img = el("img"); img.src = "media/" + w.id + ".jpg"; img.alt = ""; img.loading = "lazy"; shot.appendChild(img);
    var pl = el("span", "play"); pl.innerHTML = PLAY; shot.appendChild(pl);
    shot.appendChild(el("span", "time", w.time));
    b.appendChild(shot);
    var cap = el("span", "cap"); cap.appendChild(el("span", "k", w.kind)); cap.appendChild(el("span", "t", w.title));
    b.appendChild(cap);
    b.addEventListener("click", function(){ open(w.id) });
    return b;
  }
  function tags(list, into){ into.textContent = ""; (list||[]).forEach(function(t){ into.appendChild(el("span","tag",t)) }) }

  // секции
  var main = $("works");
  P.sections.forEach(function(s, i){
    var sec = el("section", "block"); sec.id = "s-" + s.id;
    var wrap = el("div", "wrap"), head = el("div", "head");
    head.appendChild(el("span", "num", ("0" + (i+1)).slice(-2)));
    head.appendChild(el("h2", null, s.title));
    if (s.note) head.appendChild(el("p", null, s.note));
    var grid = el("div", "grid " + s.layout);
    s.items.forEach(function(w){ grid.appendChild(card(w)) });
    if (s.layout === "feature") {
      var w = s.items[0], ft = el("div", "feature-text");

    gemini: '<svg viewBox="0 0 24 24"><defs><linearGradient id="gmn" x1="2" y1="20" x2="22" y2="4" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4285F4"/><stop offset=".5" stop-color="#9B72CB"/><stop offset="1" stop-color="#D96570"/></linearGradient></defs><path fill="url(#gmn)" d="M12 24A14.3 14.3 0 0 0 0 12 14.3 14.3 0 0 0 12 0a14.3 14.3 0 0 0 12 12 14.3 14.3 0 0 0-12 12Z"/></svg>',
    seedance: '<svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="sdn" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6FB1FF"/><stop offset="1" stop-color="#2F6BFF"/></linearGradient></defs><circle class="ring" cx="12" cy="12" r="10.5" stroke="url(#sdn)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="20 8 6 8 12 12"/><path class="tri" fill="url(#sdn)" d="M9.3 7.2v9.6a.6.6 0 0 0 .92.5l7.4-4.8a.6.6 0 0 0 0-1l-7.4-4.8a.6.6 0 0 0-.92.5Z"/></svg>'
  };
  LOGOS.premiere = '<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#00005B"/><text x="12" y="16.4" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="11.5" fill="#9999FF">Pr</text></svg>';

  // первый экран: логотипы инструментов; наведение меняет подсветку страницы и описание
  var GLOW = { chatgpt: "#ffffff", claude: "#d97757", gemini: "#a78bfa", seedance: "#2f7bff", premiere: "#9999ff" };
  var heroTools = ((P.ai && P.ai.tools) || []).concat(P.editor ? [P.editor] : []);
  if (heroTools.length) {
    var box = $("tools"), tag = $("tagline"), glow = $("glow"), sticky = null;
    box.appendChild(el("span", "lbl", "Инструменты"));
    function swap(){ tag.classList.remove("sw"); void tag.offsetWidth; tag.classList.add("sw") }
    function show(t, btn){
      if (!tag.style.minHeight) tag.style.minHeight = tag.offsetHeight + "px";
      var col = GLOW[t.id] || "#e9b872";
      tag.textContent = ""; tag.style.setProperty("--tc", col);
      tag.appendChild(el("b", null, t.name));
      var s = t.short || t.text;
      tag.appendChild(document.createTextNode(" — " + s.charAt(0).toLowerCase() + s.slice(1) + (/[.!?]$/.test(s) ? "" : ".")));
      swap(); glow.style.setProperty("--g", col); glow.classList.add("on");
      [].forEach.call(box.querySelectorAll(".tool"), function(b){ b.classList.toggle("active", b === btn) });
    }
    function reset(){
      if (sticky) { show(sticky.t, sticky.btn); return }
      tag.textContent = P.tagline; swap(); glow.classList.remove("on");
      [].forEach.call(box.querySelectorAll(".tool"), function(b){ b.classList.remove("active") });
    }
    heroTools.forEach(function(t){
      var b = el("button", "tool lg-" + t.id); b.type = "button"; b.innerHTML = LOGOS[t.id] || "";
      b.style.setProperty("--c", GLOW[t.id] || "#e9b872"); b.setAttribute("aria-label", t.name + ": " + (t.short || t.text));
      b.addEventListener("mouseenter", function(){ show(t, b) });
      b.addEventListener("mouseleave", reset);
      b.addEventListener("focus", function(){ show(t, b) });
      b.addEventListener("blur", reset);
      // нажатие закрепляет выбор (удобно на телефоне), повторное — снимает
      b.addEventListener("click", function(e){
        e.stopPropagation();
        if (sticky && sticky.btn === b) { sticky = null; reset() } else { sticky = { t: t, btn: b }; show(t, b) }
      });
      box.appendChild(b);
    });
    document.addEventListener("click", function(){ if (sticky) { sticky = null; reset() } });
  }

  var nextNum = P.sections.length + 1;
  if (P.ai && P.ai.tools && P.ai.tools.length) {
    $("s-ai").hidden = false;
    $("aiNum").textContent = ("0" + nextNum++).slice(-2);
    $("aiTitle").textContent = P.ai.title; $("aiNote").textContent = P.ai.note || "";
    P.ai.tools.forEach(function(t){
      var d = el("div", "ai"), lg = el("div", "logo lg-" + t.id);
      lg.innerHTML = LOGOS[t.id] || ""; lg.setAttribute("aria-hidden", "true");
      d.appendChild(lg); d.appendChild(el("b", null, t.name)); d.appendChild(el("span", null, t.text));
      $("aiGrid").appendChild(d);
    });
    var na = el("a", null, "Нейросети"); na.href = "#s-ai"; $("nav").appendChild(na);

    // пример: одна фотография проходит через три нейросети
    var ex = P.ai.example;
    if (ex && ex.steps && ex.steps.length) {
      $("s-example").hidden = false; $("exTitle").textContent = ex.title; $("exNote").textContent = ex.note || "";
      var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      ex.steps.forEach(function(s, i){
        var st = el("div", "step" + (s.kind === "prompt" ? " wide" : "")), fr = el("div", "frame"), m = el("div", "media" + (s.kind === "prompt" ? " prompt" : ""));
        if (s.kind === "image") { var im = el("img"); im.src = s.src; im.alt = s.label; im.loading = "lazy"; m.appendChild(im) }
        else if (s.kind === "compare") {
          // ползунок «Было / Стало»: верхний снимок обрезается по линии
          var c = el("div", "cmp"), ia = el("img"), ib = el("img", "before"), rg = el("input"), kn = el("span", "knob");
          ia.src = s.after; ia.alt = "После: " + s.label; ib.src = s.before; ib.alt = "До: исходная фотография";
          ia.draggable = false; ib.draggable = false;
          rg.type = "range"; rg.min = 0; rg.max = 100; rg.value = 50; rg.setAttribute("aria-label", "Сравнение: было и стало");
          kn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>';
          function setP(v){ v = Math.max(0, Math.min(100, v)); c.style.setProperty("--p", v + "%"); rg.value = v }
          function fromX(e){ var r = c.getBoundingClientRect(); setP((e.clientX - r.left) / r.width * 100) }
          c.addEventListener("pointerdown", function(e){ c.classList.add("drag"); try { c.setPointerCapture(e.pointerId) } catch (x) {} fromX(e) });
          c.addEventListener("pointermove", function(e){ if (c.classList.contains("drag")) fromX(e) });
          ["pointerup", "pointercancel"].forEach(function(n){ c.addEventListener(n, function(){ c.classList.remove("drag") }) });
          rg.addEventListener("input", function(){ setP(+rg.value) });
          c.appendChild(ia); c.appendChild(ib); c.appendChild(el("span", "bar"));
          c.appendChild(el("span", "tag l", "Было")); c.appendChild(el("span", "tag r", "Стало"));
          c.appendChild(rg); c.appendChild(kn); m.appendChild(c);
        }
        else if (s.kind === "video") {
          var v = el("video"); v.muted = true; v.loop = true; v.playsInline = true; v.preload = "metadata";
          if (s.poster) v.poster = s.poster; v.src = s.src; v.setAttribute("aria-label", s.label); m.appendChild(v);
          if (still) v.controls = true;
          else if ("IntersectionObserver" in window) new IntersectionObserver(function(es){
            es.forEach(function(e){ if (e.isIntersecting) { var p = v.play(); if (p && p.catch) p.catch(function(){}) } else v.pause() });
          }, { threshold: .4 }).observe(v);
        } else {
          // промт «печатается», когда блок появляется на экране
          // невидимый «хвост» держит высоту блока, чтобы страница не прыгала при печати
          var out = el("span"), caret = el("i"), rest = el("span"); rest.style.visibility = "hidden";
          m.appendChild(out); m.appendChild(caret); m.appendChild(rest);
          if (still || !("IntersectionObserver" in window)) out.textContent = s.text;
          else { rest.textContent = s.text; var done = false; new IntersectionObserver(function(es, ob){
            if (done || !es[0].isIntersecting) return; done = true; ob.disconnect();
            var n = 0, t0 = Date.now(), id = setInterval(function(){
              n = Math.min(s.text.length, Math.round((Date.now() - t0) / 22)); out.textContent = s.text.slice(0, n); rest.textContent = s.text.slice(n);
              if (n >= s.text.length) clearInterval(id);
            }, 30);
          }, { threshold: .5 }).observe(m); }
        }
        fr.appendChild(m); st.appendChild(fr);
        var who = el("div", "who"); who.appendChild(el("span", "n", ("0" + (i + 1)).slice(-2)));
        if (s.tool && LOGOS[s.tool]) { var mi = el("span", "mini lg-" + s.tool); mi.innerHTML = LOGOS[s.tool]; mi.setAttribute("aria-hidden", "true"); who.appendChild(mi) }
        who.appendChild(el("b", null, s.label)); st.appendChild(who);
        if (s.kind !== "prompt") st.appendChild(el("p", null, s.text));
        else st.appendChild(el("p", null, s.note || ""));
        $("aiFlow").appendChild(st);
      });
    }
  }
  $("skillsNum").textContent = ("0" + nextNum).slice(-2);
  P.skills.forEach(function(s){ var d = el("div","skill"); d.appendChild(el("b",null,s[0])); d.appendChild(el("span",null,s[1])); $("skills").appendChild(d) });

  // контакты (показываются, только если заполнены в works.js)
  var c = P.contacts || {}, row = $("contactRow");
  function link(text, href, ghost){ var a = el("a", "btn" + (ghost ? " ghost" : ""), text); a.href = href; if (/^https/.test(href)) { a.target = "_blank"; a.rel = "noopener" } row.appendChild(a) }
  if (c.telegram) link("Telegram: @" + c.telegram.replace(/^@/, ""), "https://t.me/" + c.telegram.replace(/^@/, ""));
  if (c.phone) link(c.phone, "tel:" + c.phone.replace(/[^\d+]/g, ""), !!c.telegram);
  if (c.email) link(c.email, "mailto:" + c.email, true);
  if (row.children.length) {
    $("contact").hidden = false; $("navContact").hidden = false;
    if (c.city) $("contactNote").textContent += " " + c.city + ".";
    // с контактами вторая кнопка первого экрана ведёт к заказу, а не к ролику
    var pf = $("playFirst"); pf.textContent = "Обсудить проект"; pf.dataset.contact = "1";
  }

  // превью: при наведении, а на тач-экранах — когда карточка в центре экрана
  function startPreview(b){
    var shot = b.querySelector(".shot"), v = shot.querySelector("video");
    if (!v) { v = el("video"); v.muted = true; v.loop = true; v.playsInline = true; v.preload = "auto";
      v.src = "media/" + b.dataset.id + ".preview.mp4"; shot.insertBefore(v, shot.children[1]);
      v.addEventListener("playing", function(){ v.classList.add("on") }); }
    var p = v.play(); if (p && p.catch) p.catch(function(){});
  }
  function stopPreview(b){ var v = b.querySelector("video"); if (v) { v.pause(); v.classList.remove("on") } }
  var cards = [].slice.call(document.querySelectorAll(".card"));
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) {
    if (window.matchMedia("(hover: hover)").matches) {
      cards.forEach(function(b){
        b.addEventListener("mouseenter", function(){ startPreview(b) });
        b.addEventListener("mouseleave", function(){ stopPreview(b) });
        b.addEventListener("focus", function(){ startPreview(b) });
        b.addEventListener("blur", function(){ stopPreview(b) });
      });
    } else if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function(es){ es.forEach(function(e){ e.isIntersecting ? startPreview(e.target) : stopPreview(e.target) }) },
        { rootMargin: "-35% 0px -35% 0px" });
      cards.forEach(function(b){ io.observe(b) });
    }
  }

  // плеер
  var lb = $("lb"), vid = $("lbVideo"), cur = -1, lastFocus = null, hero = document.querySelector(".hero video");
  function open(id){
    var i = all.findIndex(function(w){ return w.id === id }); if (i < 0) return;
    if (!lb.classList.contains("open")) lastFocus = document.activeElement;
    cur = i; var w = all[i];
    cards.forEach(stopPreview); hero.pause();
    vid.poster = "media/" + w.id + ".jpg"; vid.src = "media/" + w.id + ".mp4";
    $("lbKind").textContent = w.section; $("lbTitle").textContent = w.title;
    $("lbMeta").textContent = w.kind + " · " + w.time + (w.vertical ? " · 9:16" : " · 16:9");
    $("lbText").textContent = w.text; tags(w.tags, $("lbTags"));
    $("lbCount").textContent = (i + 1) + " / " + all.length;
    lb.classList.add("open"); document.body.style.overflow = "hidden";
    try { history.replaceState(null, "", "#" + w.id) } catch (e) {}
    var p = vid.play(); if (p && p.catch) p.catch(function(){});
    $("lbClose").focus();
  }
  function close(){
    vid.pause(); vid.removeAttribute("src"); vid.load();
    lb.classList.remove("open"); document.body.style.overflow = "";
    try { history.replaceState(null, "", location.pathname + location.search) } catch (e) {}
    var p = hero.play(); if (p && p.catch) p.catch(function(){});
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function step(d){ open(all[(cur + d + all.length) % all.length].id) }
  $("lbClose").onclick = close; $("lbPrev").onclick = function(){ step(-1) }; $("lbNext").onclick = function(){ step(1) };
  lb.addEventListener("click", function(e){ if (e.target === lb || e.target.classList.contains("stage")) close() });
  vid.addEventListener("ended", function(){ /* остаёмся на ролике: заказчик сам решает, что смотреть дальше */ });
  document.addEventListener("keydown", function(e){
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowRight" && document.activeElement !== vid) step(1);
    else if (e.key === "ArrowLeft" && document.activeElement !== vid) step(-1);
    else if ((e.key === "f" || e.key === "F" || e.key === "а" || e.key === "А") && vid.requestFullscreen) {
      document.fullscreenElement ? document.exitFullscreen() : vid.requestFullscreen();
    }
  });
  $("playFirst").onclick = function(){
    if (this.dataset.contact) $("contact").scrollIntoView({ behavior: "smooth" }); else open(all[0].id);
  };

  // шапка и прямая ссылка на ролик (index.html#japan)
  var top = $("top");
  function onScroll(){ top.classList.toggle("solid", window.scrollY > 40) }
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
  var h = location.hash.slice(1);
  if (h && all.some(function(w){ return w.id === h })) open(h);
})();
</script>
